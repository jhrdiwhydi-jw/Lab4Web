
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Layout Sederhana</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<div id="container">

    <header>
        <h1>Website Saya</h1>
        <p>Hubungi kami melalui form berikut</p>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="kontak.html" class="active">Contact</a>
    </nav>

    <section class="contact-content">

        <h2>Hubungi Saya</h2>
        <p>Silakan isi form berikut untuk mengirim pesan.</p>

        <form action="#" method="post">

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama"
                   placeholder="Masukkan nama lengkap" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Masukkan alamat email" required>

            <label for="subjek">Subjek</label>
            <input type="text" id="subjek" name="subjek"
                   placeholder="Masukkan subjek pesan">

            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan" rows="6"
                      placeholder="Tuliskan pesan Anda"
                      required></textarea>

            <button type="submit">Kirim Pesan</button>

        </form>

    </section>

    <footer>
        <p>&copy; 2026 Website Saya. All Rights Reserved.</p>
    </footer>

</div>

</body>
</html>
